<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEase - Order Success</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">ShopEase</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="login.html">Login</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="success-page">
      <div class="success-card">

        <div class="success-icon">✓</div>

        <p class="success-tag">ORDER CONFIRMED</p>

        <h1>Thank You for Your Order!</h1>

        <p class="success-message">
          Your order has been placed successfully.
          We will process it shortly.
        </p>

        <div id="order-details" class="order-details"></div>

        <div class="success-actions">
          <a href="products.html" class="btn">Continue Shopping</a>
          <a href="index.html" class="success-home">Back to Home</a>
        </div>

      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 ShopEase. All rights reserved.</p>
  </footer>

  <script>
    const orderDetails = document.getElementById('order-details');
    const lastOrder = localStorage.getItem('lastOrder');

    if (lastOrder) {
      const order = JSON.parse(lastOrder);

      orderDetails.innerHTML = `
        <div class="order-detail-row">
          <span>Order ID</span>
          <strong>${order._id}</strong>
        </div>

        <div class="order-detail-row">
          <span>Total Amount</span>
          <strong>₹${order.totalAmount}</strong>
        </div>

        <div class="order-detail-row">
          <span>Payment</span>
          <strong>${order.paymentMethod}</strong>
        </div>

        <div class="order-detail-row">
          <span>Status</span>
          <strong>${order.status}</strong>
        </div>
      `;
    } else {
      orderDetails.innerHTML = `
        <p>Order details are not available.</p>
      `;
    }
  </script>

  <script src="js/navbar.js"></script>
</body>
</html>
